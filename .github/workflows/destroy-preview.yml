name: Destroy Preview

on:
  pull_request:
    types: [closed]

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      BUCKET_NAME: jtl-preview-bucket
    steps:
      - name: Remove PR preview files
        run: aws s3 rm s3://$BUCKET_NAME/pr-${{ github.event.number }}/ --recursive
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}